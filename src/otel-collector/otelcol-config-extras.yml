# Whawit customization layer (loaded last; see upstream note: the collector
# merges maps but REPLACES arrays, so upstream pipelines are left untouched and
# Whawit gets its own `*/whawit` pipelines instead).
#
# What leaves the VM:
#   - traces  -> Whawit OTLP ingest (tail-sampled: every error/slow trace, 5 % of the rest)
#   - logs    -> Whawit OTLP ingest + Google Cloud Logging (logName astronomy-shop)
#   - metrics -> Whawit OTLP ingest (only what the services emit via OTLP + span metrics;
#               docker/host/nginx/redis/postgres scrapes stay local in Prometheus)
#   - every Whawit-bound signal is also written to /recordings as OTLP JSON, so a
#     scenario run leaves a replayable capture of exactly what Whawit saw.
#
# WHAWIT_API_KEY is injected by whawit/vm/startup.sh from Secret Manager at boot
# and never lives in this repository.

exporters:
  otlphttp/whawit:
    endpoint: ${env:WHAWIT_OTLP_ENDPOINT}
    encoding: json
    compression: gzip
    timeout: 30s
    headers:
      x-whawit-api-key: ${env:WHAWIT_API_KEY}
      x-whawit-project-id: ${env:WHAWIT_PROJECT_ID}
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 600s

  googlecloud:
    project: whawit
    log:
      default_log_name: astronomy-shop
      resource_filters:
        - prefix: service.
        - prefix: host.name
        - prefix: container.

  file/traces:
    path: /recordings/traces.jsonl
    format: json
    create_directory: true
    rotation:
      max_megabytes: 200
      max_days: 7
      max_backups: 30
  file/logs:
    path: /recordings/logs.jsonl
    format: json
    create_directory: true
    rotation:
      max_megabytes: 200
      max_days: 7
      max_backups: 30
  file/metrics:
    path: /recordings/metrics.jsonl
    format: json
    create_directory: true
    rotation:
      max_megabytes: 200
      max_days: 7
      max_backups: 30

processors:
  # Envoy access logs (one per proxied request) are ~80 % of the log volume and
  # crowd out the application errors inside Whawit's per-window row cap; the
  # request-level view already reaches Whawit through traces and span metrics.
  filter/whawit_noise:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["event.name"] == "proxy.access"'
  # Keep every trace that carries an error or is slow; sample the healthy bulk.
  tail_sampling/whawit:
    decision_wait: 10s
    num_traces: 20000
    expected_new_traces_per_sec: 200
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 2000
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 5
  batch/whawit:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

service:
  pipelines:
    traces/whawit:
      receivers: [otlp]
      processors: [resource_detection, memory_limiter, transform/sanitize_spans, transform/redact_sensitive_data, tail_sampling/whawit, batch/whawit]
      exporters: [otlphttp/whawit, file/traces]
    metrics/whawit:
      receivers: [otlp, span_metrics]
      processors: [resource_detection, memory_limiter, batch/whawit]
      exporters: [otlphttp/whawit, file/metrics]
    logs/whawit:
      receivers: [otlp]
      processors: [resource_detection, memory_limiter, transform/sanitize_logs, filter/whawit_noise, batch/whawit]
      exporters: [otlphttp/whawit, googlecloud, file/logs]
