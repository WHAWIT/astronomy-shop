# Whawit extras layer (always loaded last by the Makefile).
# Gives the collector the Whawit exporter settings, room for tail sampling, and a
# host directory for the OTLP JSON recordings. The exporter config itself lives in
# src/otel-collector/otelcol-config-extras.yml.

services:
  otel-collector:
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - WHAWIT_OTLP_ENDPOINT
      - WHAWIT_PROJECT_ID
      - WHAWIT_API_KEY
      - GOMEMLIMIT=800MiB
    volumes:
      - ${WHAWIT_RECORDINGS_DIR:-./recordings}:/recordings
